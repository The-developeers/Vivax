version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: viva_mais_db
    restart: always
    env_file:
      - .env.homolog
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - viva_plus_data:/var/lib/postgresql/data

volumes:
  viva_plus_data: